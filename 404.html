<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="utf-8" />
        <meta name="robots" content="noindex,nofollow">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>ページが見つかりません - KOHEI NISHIKURA | 西倉康平</title>
        <!-- 存在しないアドレスを開いたときに GitHub Pages が出すページ（2026-11-24）
             どの階層のアドレスでも出るので、画像とリンクは /profile/ から書き、見た目はこのページの中に書く -->
        <link rel="icon" type="image/x-icon" href="/profile/assets/favicon.ico" sizes="75x75">
        <link rel="apple-touch-icon" href="/profile/assets/apple-touch-icon.png" sizes="180x180">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
        <style>
            :root {
                --color-text: #4b4b4b;
                --color-bg: #fff;
                color-scheme: light;
            }
            * { box-sizing: border-box; }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                padding: 40px 20px;
                background-color: var(--color-bg);
                color: var(--color-text);
                font-family: 'Noto Sans JP', sans-serif;
                text-align: center;
            }
            .my-name {
                display: inline-block;
                margin-bottom: 40px;
                font-size: 24px;
                font-weight: 700;
                color: var(--color-text);
                text-decoration: none;
            }
            h1 {
                margin: 0 0 16px;
                font-size: 40px;
                font-weight: 700;
            }
            p {
                margin: 0 0 32px;
                font-size: 16px;
            }
            .back {
                display: inline-block;
                min-height: 44px;
                padding: 10px 32px;
                border: 1px solid var(--color-text);
                color: var(--color-text);
                font-size: 14px;
                text-decoration: none;
            }
            a:focus-visible {
                outline: 2px solid var(--color-text);
                outline-offset: 4px;
            }
            @media (hover: hover) {
                a { transition: opacity .3s ease; }
                a:hover { opacity: .7; }
            }
            @media (prefers-reduced-motion: reduce) {
                a { transition: none; }
            }
        </style>
    </head>
    <body>
        <main>
            <a class="my-name" href="/profile/">KOHEI NISHIKURA</a>
            <h1>404</h1>
            <p>ページが見つかりません</p>
            <a class="back" href="/profile/">トップページへ戻る</a>
        </main>
    </body>
</html>
